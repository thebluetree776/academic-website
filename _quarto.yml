project:
  type: website
  render:
    - "*.qmd"
  resources:
    - "assets/"
    - "CNAME"

website:
  title: "Ichio Aoki"
  site-url: "https://ichio-aoki.com"
  description: "Ichio Aoki: PhD student in economics at the University of Tokyo and JSPS Research Fellow (DC2), researching market integration and customs unions in 19th-century Germany."
  favicon: favicon.svg
  open-graph: true
  twitter-card: true
  sidebar:
    style: docked
    background: light
    contents:
      - text: "English"
        href: index.qmd
      - text: "日本語"
        href: index-jp.qmd
      - text: "Notes"
        href: blog.qmd

format:
  html:
    theme: cosmo
    toc: false
    css: styles.css
    filters:
      - filters/download-links.lua
